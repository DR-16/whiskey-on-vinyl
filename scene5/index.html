<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>黑胶上的威士忌 · 整间 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { --ink-1:#0E0716; --plum:#1A0E2E; --smoke:#6B4A8C; --mist:#B8A0D8;
      --paper:#E8DDF0; --paper-dim:#C4B5D4; --copper:#C89B6C; --rule:rgba(184,160,216,0.18); }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--ink-1); color: var(--paper);
      font-family: "Noto Serif SC", "PingFang SC", serif; font-weight: 300;
      overflow: hidden; height: 100vh; width: 100vw; }
    .hud {
      position: fixed; top: 16px; left: 16px;
      background: rgba(14,7,22,0.78); border: 1px solid rgba(184,160,216,0.24);
      padding: 14px 18px; backdrop-filter: blur(12px);
      z-index: 10; font-size: 13px; max-width: 380px;
    }
    .hud h1 {
      margin: 0 0 4px; font-size: 22px; font-weight: 400;
      font-family: "Ma Shan Zheng", cursive; color: var(--paper); letter-spacing: 0.08em;
    }
    .hud .sub {
      font-family: "Cormorant Garamond", serif; font-style: italic;
      font-size: 11px; color: var(--paper-dim); letter-spacing: 0.3em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hud p {
      margin: 8px 0 0; font-size: 12px; color: var(--paper-dim); line-height: 1.55;
    }
    .hud b { color: var(--copper); font-weight: 400; }
    .scene-picker {
      margin-top: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .scene-picker .label {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px; letter-spacing: 0.25em; color: var(--paper-dim); text-transform: uppercase;
    }
    .scene-picker select {
      background: rgba(14,7,22,0.8); color: var(--paper);
      border: 1px solid rgba(184,160,216,0.3);
      padding: 8px 10px; font-family: inherit; font-size: 12px;
      cursor: pointer; outline: none;
    }
    .scene-picker select:focus { border-color: var(--copper); }
    .views {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px;
    }
    .views button {
      background: transparent; color: var(--paper);
      border: 1px solid rgba(184,160,216,0.25);
      padding: 5px 10px; font-family: inherit; font-size: 11px;
      cursor: pointer; letter-spacing: 0.1em; transition: all .25s;
    }
    .views button:hover, .views button.on {
      border-color: var(--copper); background: rgba(200,155,108,0.15);
    }
    .info {
      position: fixed; bottom: 16px; left: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; color: var(--paper-dim); letter-spacing: 0.18em;
      background: rgba(14,7,22,0.55);
      padding: 8px 12px; border: 1px solid rgba(184,160,216,0.15);
      z-index: 10;
    }
    .back-link {
      position: fixed; top: 16px; right: 16px;
      z-index: 10; font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.18em; color: var(--copper);
      text-decoration: none; padding: 8px 12px;
      background: rgba(14,7,22,0.55); border: 1px solid var(--copper);
    }
    .back-link:hover { background: rgba(200,155,108,0.2); }
    model-viewer {
      width: 100vw; height: 100vh;
      background: radial-gradient(ellipse at center, #1A0E2E 0%, #07040E 80%);
      --poster-color: transparent;
    }
    .loading-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: rgba(7,4,14,0.9); z-index: 50;
      color: var(--paper-dim); letter-spacing: 0.25em; font-size: 13px;
      pointer-events: none;
    }
    .loading-overlay.hidden { display: none; }
    .loading-overlay .bar { width: 220px; height: 2px; background: rgba(184,160,216,0.2); }
    .loading-overlay .bar > div { height: 100%; background: var(--copper); width: 0%; transition: width 0.3s; }
    .loading-overlay .pct { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--copper); }
  </style>
</head>
<body>

<div class="hud">
  <h1>黑胶上的威士忌 · 整间 3D</h1>
  <div class="sub">FULL INTERIOR RECONSTRUCTION FROM AI</div>
  <p>
    每个 Hunyuan 3D 模型都是同一间酒吧从一张 AI 图重建出来的"整间快照"。
    下拉框里 6 个**完整空间还原**版本可切换 —— 选你最满意的当作"最终整间 3D"。
  </p>
  <p style="font-size:11px; opacity:0.7;">
    其余 14 个偏特写 / 单元的可在
    <a href="/gallery/" style="color:var(--copper);">单图模式</a>
    里看。
  </p>

  <div class="scene-picker">
    <div class="label">选择整间 3D 版本</div>
    <select id="scene-select">
      <option value="02-hero-wide" selected>02 · 入口主视 — 整间最完整</option>
      <option value="01-floorplan-master">01 · 俯瞰花板 — 平面视角</option>
      <option value="06-hall-dense-overview">06 · 主厅密集 — 沙发群最多</option>
      <option value="07-hall-clusters-pov">07 · 主厅 POV — 走入视角</option>
      <option value="03-bar-straight">03 · 吧台为主 — 偏重吧台</option>
      <option value="10-vip-semicircle">10 · VIP 视角 — 偏重 VIP</option>
    </select>
  </div>

  <div class="views">
    <button data-orbit="0deg 75deg 4m" class="on">主视</button>
    <button data-orbit="90deg 70deg 4m">侧视</button>
    <button data-orbit="0deg 0deg 5m">俯瞰</button>
    <button data-orbit="0deg 90deg 4m">侧抬</button>
    <button data-orbit="180deg 75deg 4m">反向</button>
  </div>
</div>

<a class="back-link" href="/gallery/">← 全部 20 个</a>
<div class="info">DRAG · ORBIT &nbsp;|&nbsp; SCROLL · ZOOM &nbsp;|&nbsp; FULL INTERIOR · 1 MODEL</div>

<div class="loading-overlay" id="loader">
  <div>LOADING 3D INTERIOR …</div>
  <div class="bar"><div id="bar-inner"></div></div>
  <div class="pct" id="loader-pct">0%</div>
</div>

<model-viewer
  id="mv"
  src="../gallery/02-hero-wide.glb"
  alt="整间 3D"
  camera-controls
  touch-action="pan-y"
  loading="eager"
  reveal="auto"
  auto-rotate
  auto-rotate-delay="3000"
  rotation-per-second="6deg"
  shadow-intensity="0.5"
  shadow-softness="0.7"
  exposure="1.4"
  tone-mapping="aces"
  environment-image="../gallery/02-hero-wide.webp"
  camera-orbit="0deg 75deg 4m"
  field-of-view="42deg"
  min-camera-orbit="auto auto 1m"
  max-camera-orbit="auto auto 15m">
</model-viewer>

<script>
  const mv = document.getElementById('mv');
  const loader = document.getElementById('loader');
  const bar = document.getElementById('bar-inner');
  const pct = document.getElementById('loader-pct');
  const select = document.getElementById('scene-select');

  function setLoading(state) {
    if (state) {
      loader.classList.remove('hidden');
      bar.style.width = '0%';
      pct.textContent = '0%';
    } else {
      loader.classList.add('hidden');
    }
  }

  mv.addEventListener('progress', (e) => {
    const p = Math.round(e.detail.totalProgress * 100);
    bar.style.width = p + '%';
    pct.textContent = p + '%';
    if (p >= 100) setTimeout(() => setLoading(false), 400);
  });
  mv.addEventListener('load', () => setLoading(false));

  document.querySelectorAll('.views button').forEach(b => {
    b.addEventListener('click', () => {
      mv.cameraOrbit = b.dataset.orbit;
      document.querySelectorAll('.views button').forEach(x => x.classList.toggle('on', x === b));
    });
  });

  select.addEventListener('change', () => {
    const name = select.value;
    setLoading(true);
    mv.src = `../gallery/${name}.glb`;
    mv.environmentImage = `../gallery/${name}.webp`;
  });
</script>

</body>
</html>
